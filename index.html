<script>
/* 전역 플래그: 카테고리 타일을 클릭했는지 여부 */
window.categorySelected = window.categorySelected || false;

/* 랜딩 해제 + 카테고리 바 접기(1행 모드) */
function exitLanding(){
  document.body.classList.remove('mode-landing');
  const quick = document.querySelector('.quick-cats');
  if (quick){
    quick.classList.add('is-compact');
    ensureAllTile(quick);      // ✅ 1행 모드에서만 ALL 버튼 생성
    attachQuickCatsNav(quick); // 좌/우 버튼 생성+동작
  }
}

/* 1행 모드일 때만 ALL 버튼을 선두에 보장 */
function ensureAllTile(quick){
  if (!quick || !quick.classList.contains('is-compact')) return;

  // 이미 있으면 스킵
  if (quick.querySelector('.cat-tile.cat-all[data-cat="all"]')) return;

  const allBtn = document.createElement('button');
  allBtn.className = 'cat-tile cat-all';
  allBtn.dataset.cat = 'all';
  allBtn.innerHTML = `<span>ALL</span>`;
  allBtn.addEventListener('click', () => {
    // ALL 선택 시: 카테고리 선택 여부 false로 초기화하고 전체 검색 상태
    window.categorySelected = false;
    activateTile('all');
    // 검색창 값 유지한 채 전체로 apply (검색어 없으면 미리보기 6개)
    window.currentCat = 'all';
    typeof window.apply === 'function' && window.apply();
    document.getElementById('list')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  quick.prepend(allBtn);
}

/* 좌/우 내비게이션 부착 */
function attachQuickCatsNav(quick){
  if (!quick || !quick.classList.contains('is-compact')) return;

  // 네비 버튼 폭(아이콘+여백)
  const NAV_W = 40; // px

  // ① 래퍼가 없으면 생성
  let wrap = quick.parentElement;
  if (!wrap || !wrap.classList.contains('quick-cats-wrap')){
    wrap = document.createElement('div');
    wrap.className = 'quick-cats-wrap';
    quick.replaceWith(wrap);
    wrap.appendChild(quick);
  }

  // ② 래퍼 패딩으로 버튼 자리 확보 (트랙은 패딩 0)
  wrap.style.position = 'relative';
  wrap.style.paddingLeft  = NAV_W + 'px';
  wrap.style.paddingRight = NAV_W + 'px';
  quick.style.paddingLeft  = '0';
  quick.style.paddingRight = '0';

  // ③ 끝 타일까지 보이게 스크롤 패딩 지정
  quick.style.scrollPaddingLeft  = NAV_W + 'px';
  quick.style.scrollPaddingRight = NAV_W + 'px';

  // ④ 좌/우 버튼
  let prev = wrap.querySelector('.cats-prev');
  let next = wrap.querySelector('.cats-next');
  if (!prev || !next){
    prev = document.createElement('button');
    next = document.createElement('button');
    prev.type = next.type = 'button';
    prev.className = 'cats-nav cats-prev';
    next.className = 'cats-nav cats-next';
    prev.setAttribute('aria-label','이전');
    next.setAttribute('aria-label','다음');
    prev.textContent = '‹';
    next.textContent = '›';
    wrap.append(prev, next);
  }

  // ⑤ 버튼 배치 (래퍼 안쪽으로 겹치게)
  Object.assign(prev.style, {
    position:'absolute', left:'0', width: NAV_W+'px',
    zIndex:'2'
  });
  Object.assign(next.style, {
    position:'absolute', right:'0', width: NAV_W+'px',
    zIndex:'2'
  });

  // ⑥ 스크롤/내비 로직
  const step = () => Math.max(160, Math.round(wrap.clientWidth * 0.8));
  const clamp = v => Math.min(Math.max(v, 0), Math.max(0, quick.scrollWidth - quick.clientWidth));
  const scrollByClamped = dx => quick.scrollTo({ left: clamp(quick.scrollLeft + dx), behavior: 'smooth' });

  prev.onclick = () => scrollByClamped(-step());
  next.onclick = () => scrollByClamped(+step());

  // 마우스 휠로도 가로 스크롤
  quick.addEventListener('wheel', (e)=>{
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      quick.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, {passive:false});

  function updateNav(){
    const overflow = quick.scrollWidth > quick.clientWidth + 1;
    const atStart  = quick.scrollLeft <= 1;
    const atEnd    = quick.scrollLeft + quick.clientWidth >= quick.scrollWidth - 1;
    prev.style.display = next.style.display = overflow ? '' : 'none';
    if (overflow){ prev.disabled = atStart; next.disabled = atEnd; }
  }

  quick.addEventListener('scroll', updateNav, { passive:true });
  window.addEventListener('resize', updateNav);
  new ResizeObserver(updateNav).observe(quick);
  updateNav();
}


/* (호출 호환용) 기존 이름 유지 */
function updateEdgeState(quick){
  if (quick) {
    const prev = quick.querySelector('.cats-prev');
    const next = quick.querySelector('.cats-next');
    if (!prev || !next) return;
    const overflow = quick.scrollWidth > quick.clientWidth + 1;
    const atStart  = quick.scrollLeft <= 1;
    const atEnd    = quick.scrollLeft + quick.clientWidth >= quick.scrollWidth - 1;
    prev.style.display = next.style.display = overflow ? '' : 'none';
    prev.disabled = atStart;
    next.disabled = atEnd;
  }
}

/* 타일 활성 표시 공통 */
function activateTile(catKey){
  const quick = document.querySelector('.quick-cats');
  if (!quick) return;
  const tiles = Array.from(quick.querySelectorAll('.cat-tile'));
  tiles.forEach(b => b.classList.remove('active'));

  // 공백 제거 후 비교
  const findBy = (el) => (el.dataset.cat || '').replace(/\s/g,'') === (catKey || '').replace(/\s/g,'');
  const target =
    (catKey === 'all')
      ? quick.querySelector('.cat-tile.cat-all[data-cat="all"]')
      : tiles.find(findBy);

  if (target){
    target.classList.add('active');
    target.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  }
}

/* 카테고리 선택: 1행 전환 + 검색어 초기화 + 즉시 결과는 "비움"(app.js가 처리) */
function selectCategory(cat) {
  exitLanding();
  window.categorySelected = true;                 // ✅ 카테고리 선택됨
  const $q = document.getElementById('q');
  if ($q) $q.value = '';                         // 규칙상 선택 직후엔 검색어 없음

  // 현재 카테고리 상태 갱신
  window.currentCat = (typeof normCat === 'function') ? normCat(cat) : cat;
  activateTile(cat);

  // 결과 갱신: 검색어가 비어있으므로 app.js에서 "결과 0개"로 보이게 됨
  if (typeof window.apply === 'function') window.apply();

  document.getElementById('list')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* 초기 바인딩 */
document.addEventListener('DOMContentLoaded', () => {
  // 2행 타일 클릭 → selectCategory
  document.querySelectorAll('.cat-tile[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => selectCategory(btn.dataset.cat || 'all'));
  });

  // 검색 submit → 1행 전환 + ALL 또는 현재 선택 카테고리 규칙 적용
  const form = document.getElementById('searchForm');
  const input = document.getElementById('q');
  form?.addEventListener('submit', (e) => {
    e.preventDefault();
    const qVal = (input?.value || '').trim();

    if (!qVal) {
      // 검색어가 없으면: 랜딩 유지(=2행 유지), 아무 변화 없음
      return;
    }

    // 검색어가 있을 때는 반드시 1행 전환
    exitLanding();

    // 카테고리 미선택 상태라면 → ALL 선택 후 전체 검색
    if (!window.categorySelected) {
      ensureAllTile(document.querySelector('.quick-cats'));
      activateTile('all');
      window.currentCat = 'all';
    } else {
      // 이미 카테고리 선택됨 → 그 카테고리 유지
      activateTile(window.currentCat || 'all');
    }

    // app.js의 apply가 q + currentCat 상태로 결과 그려줌
    if (typeof window.apply === 'function') window.apply();

    document.getElementById('list')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // 혹시 처음부터 compact로 시작한다면 버튼 상태 맞추기
  const quick = document.querySelector('.quick-cats');
  if (quick?.classList.contains('is-compact')) {
    ensureAllTile(quick);
    attachQuickCatsNav(quick);
  }
});
</script>

<script>
(function(){

  const pickedWrap    = document.getElementById('pickedWrap');
  const btnDeleteTg   = document.getElementById('btnDeleteToggle');
  const btnDone       = document.getElementById('manageDone');
  const btnCancel     = document.getElementById('manageCancel');
  const btnCloseX     = manageDlg.querySelector('.icon-btn[aria-label="닫기"]');

  const severityDlg   = document.getElementById('severityDlg');
  const sevOk         = document.getElementById('sevOk');
  const sevCancel     = document.getElementById('sevCancel');

  const confirmDlg    = document.getElementById('confirmDlg');
  const confirmYes    = document.getElementById('confirmYes');
  const confirmCancel = document.getElementById('confirmCancel');

  // 드래프트 상태(확인 눌러야 저장)
  let draft = new Map();     // code -> {code,label,severity}
  let deleteMode = false;    // 삭제 오버레이 토글
  let pendingPick = null;    // { code, label }

  /* ---------- 배지 문구 ---------- */
  function refreshPill(){
    const s = AllergyStore.load();
    if (s.items.length){
      pillText && (pillText.textContent = `${s.items.map(x=>x.label).slice(0,2).join(', ')} 등의 성분이 검색에서 제외/주의돼요`);
      entry?.classList.add('has-data');
    }else{
      pillText && (pillText.textContent = '안전한 식품 검색을 위해 알레르기 정보를 알려주세요');
      entry?.classList.remove('has-data');
    }
  }

  /* ---------- 모달 열기 ---------- */
  function openManage(){
    const s = AllergyStore.load();
    draft = new Map((s.items||[]).map(it => [it.code, {...it}]));
    deleteMode = false;
    renderPicked();
    markPickedTiles();
    manageDlg.showModal();
  }

  /* ---------- 상단 카드 렌더 ---------- */
  function renderPicked(){
    pickedWrap.innerHTML = '';
    if (draft.size === 0){
      pickedWrap.innerHTML = '<p class="mute">선택한 알레르기가 없어요.</p>';
      return;
    }

    for (const item of draft.values()){
      const card = document.createElement('div');
      card.style.cssText = 'width:112px;padding:10px 10px 8px;border:1px solid #e9ece6;border-radius:12px;position:relative;background:#fff;cursor:pointer;';
      card.innerHTML = `
        <span style="position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #fff;background:${item.severity==='danger' ? '#ef4444' : '#f59e0b'}"></span>
        <div style="width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#f8faf7;display:grid;place-items:center;">
          <img src="${encodeURI(`./assets/allergy/${item.label}.png`)}" alt="${item.label}" style="width:100%;height:100%;object-fit:cover;">
        </div>
        <div style="text-align:center;font-size:13px;margin-top:6px;">${item.label}</div>
        ${deleteMode ? `<button data-code="${item.code}" class="trash" style="position:absolute;inset:10px 10px 28px 10px;border-radius:10px;background:rgba(0,0,0,.45);display:grid;place-items:center;border:0;cursor:pointer;"><span style="font-size:28px;color:#fff;">🗑</span></button>` : ''}
      `;

      // 카드 클릭 → 심각도 수정 (삭제모드 아닐 때)
      card.addEventListener('click', (ev)=>{
        if (deleteMode && ev.target.closest('.trash')) return;
        if (deleteMode) return;
        const cur = draft.get(item.code);
        editSeverity(item.code, item.label, cur?.severity || 'danger');
      });

      // 삭제버튼 → 확인 모달
      card.querySelector('.trash')?.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const code = ev.currentTarget.dataset.code;
        closeForStack(manageDlg, ()=>{
          confirmDlg.showModal();
          const onOk = (e)=>{ e.preventDefault(); confirmDlg.close('ok'); };
          confirmYes.addEventListener('click', onOk, {once:true});
          confirmCancel.addEventListener('click', ()=>confirmDlg.close('cancel'), {once:true});
          confirmDlg.addEventListener('close', ()=>{
            if (confirmDlg.returnValue === 'ok'){ draft.delete(code); }
            openBack(manageDlg); renderPicked(); markPickedTiles();
          }, {once:true});
        });
      });

      pickedWrap.appendChild(card);
    }
  }

  /* ---------- 추가 섹션 타일 ---------- */
  manageDlg.addEventListener('click', (e)=>{
    const tile = e.target.closest('.pick');
    if (!tile) return;
    const code = tile.dataset.code;
    const label = tile.dataset.label;
    const cur = draft.get(code);
    editSeverity(code, label, cur?.severity || 'danger');
  });

  /* ---------- 심각도 편집 ---------- */
  function editSeverity(code, label, current='danger'){
    pendingPick = { code, label };
    closeForStack(manageDlg, ()=>{
      (severityDlg.querySelector(`input[name="sev"][value="${current}"]`)
        || severityDlg.querySelector('input[name="sev"][value="danger"]')
      ).checked = true;
      severityDlg.showModal();
    });
  }
  sevOk.addEventListener('click', (e)=>{
    e.preventDefault();
    if (!pendingPick) return;
    const sev = severityDlg.querySelector('input[name="sev"]:checked')?.value || 'danger';
    draft.set(pendingPick.code, { ...pendingPick, severity: sev });
    pendingPick = null;
    severityDlg.close('ok');
    openBack(manageDlg); renderPicked(); markPickedTiles();
  });
  sevCancel.addEventListener('click', (e)=>{ e.preventDefault(); severityDlg.close('cancel'); openBack(manageDlg); });

  /* ---------- 삭제 토글 ---------- */
  btnDeleteTg?.addEventListener('click', ()=>{ deleteMode = !deleteMode; renderPicked(); });

  /* ---------- 저장/닫기 ---------- */
  btnDone.addEventListener('click', (e)=>{
    e.preventDefault();
    const items = [...draft.values()];
    AllergyStore.save({ items, updatedAt: Date.now() });
    manageDlg.close('ok');
    refreshPill();
  });
  btnCancel?.addEventListener('click', (e)=>{ e.preventDefault(); manageDlg.close('cancel'); });
  btnCloseX?.addEventListener('click', (e)=>{ e.preventDefault(); manageDlg.close('cancel'); });

  /* ---------- 선택된 타일 표시 ---------- */
  function markPickedTiles(){
    const selected = new Set([...draft.keys()]);
    manageDlg.querySelectorAll('.pick').forEach(b=>{
      b.classList.toggle('is-picked', selected.has(b.dataset.code));
    });
  }

  /* ---------- 모달 스택 헬퍼 ---------- */
  function closeForStack(dialog, fn){ dialog.close('stack'); fn && fn(); }
  function openBack(dialog){ dialog.showModal(); }

  /* ---------- 배지 클릭으로 열기 ---------- */
  entry?.addEventListener('click', ()=>{
    openManage(); // 저장 없을 때도 동일 모달로 진입 (원하면 여기서 페이지 이동으로 바꿔도 됨)
  });

  document.addEventListener('DOMContentLoaded', refreshPill);
  refreshPill();
})();
</script>
